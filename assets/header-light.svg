<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <style>
    .name { font: 800 64px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #0E1230; letter-spacing: -1.5px; }
    .role { font: 600 24px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: url(#txt); }
    .meta { font: 500 16px 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; fill: #5A6185; letter-spacing: 0.5px; }
    .code { font: 500 14px 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .fade1 { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .1s forwards; }
    .fade2 { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .35s forwards; }
    .fade3 { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .6s forwards; }
    .fade4 { opacity: 0; animation: in 1.2s ease .9s forwards; }
    .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .typing { clip-path: inset(0 100% 0 0); animation: type 2.2s steps(34) 1.1s forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes in { to { opacity: 1; } }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(-60px, 30px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(50px, -25px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F9FE"/>
      <stop offset="1" stop-color="#ECEFFB"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4A63E8"/>
      <stop offset=".55" stop-color="#8A3FE0"/>
      <stop offset="1" stop-color="#D93D97"/>
    </linearGradient>
    <radialGradient id="o1" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#5B6CFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5B6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o2" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#D45BFF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#D45BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1B2150" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gm"><rect width="1200" height="320" fill="url(#gridFade)"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gm)"/>
    <circle class="orb1" cx="980" cy="70" r="260" fill="url(#o1)"/>
    <circle class="orb2" cx="760" cy="330" r="220" fill="url(#o2)"/>

    <!-- left: intro -->
    <g transform="translate(64 0)">
      <text class="meta fade1" x="0" y="92">// hello, world — I'm</text>
      <text class="name fade2" x="-3" y="160">Ibrahim Hafez</text>
      <text class="role fade3" x="0" y="204">Software Engineer · Full-stack &amp; Web</text>
      <g class="fade4">
        <circle cx="6" cy="250" r="5" fill="#3DDC97"/>
        <circle cx="6" cy="250" r="9" fill="#3DDC97" fill-opacity=".2"/>
        <text class="meta" x="24" y="255">Glasgow, UK  ·  building with TypeScript &amp; Next.js</text>
      </g>
    </g>

    <!-- right: code window -->
    <g class="fade4" transform="translate(770 62)">
      <rect width="366" height="196" rx="14" fill="#0B0F22" fill-opacity=".72" stroke="#FFFFFF" stroke-opacity=".09"/>
      <circle cx="22" cy="22" r="5.5" fill="#FF5F57"/>
      <circle cx="40" cy="22" r="5.5" fill="#FEBC2E"/>
      <circle cx="58" cy="22" r="5.5" fill="#28C840"/>
      <text class="code" x="300" y="27" fill="#5A6185" text-anchor="end">ibrahim.ts</text>
      <line x1="0" y1="44" x2="366" y2="44" stroke="#FFFFFF" stroke-opacity=".07"/>
      <text class="code" x="22" y="74"><tspan fill="#B57CFF">const</tspan><tspan fill="#E6E9F5"> ibrahim </tspan><tspan fill="#8B93B5">= {</tspan></text>
      <text class="code" x="42" y="100"><tspan fill="#7CC8FF">stack</tspan><tspan fill="#8B93B5">: [</tspan><tspan fill="#9EE6A8">"TS"</tspan><tspan fill="#8B93B5">, </tspan><tspan fill="#9EE6A8">"React"</tspan><tspan fill="#8B93B5">, </tspan><tspan fill="#9EE6A8">"Next"</tspan><tspan fill="#8B93B5">],</tspan></text>
      <text class="code" x="42" y="126"><tspan fill="#7CC8FF">base</tspan><tspan fill="#8B93B5">: </tspan><tspan fill="#9EE6A8">"Glasgow"</tspan><tspan fill="#8B93B5">,</tspan></text>
      <g class="typing">
        <text class="code" x="42" y="152"><tspan fill="#7CC8FF">now</tspan><tspan fill="#8B93B5">: </tspan><tspan fill="#FFC27C">"shipping fast websites"</tspan></text>
      </g>
      <text class="code" x="22" y="178" fill="#8B93B5">};<tspan class="cursor" fill="#B57CFF"> ▍</tspan></text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" stroke="#1B2150" stroke-opacity=".1"/>
  </g>
</svg>
