<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <style>
    .t { font: 600 18px 'Segoe UI', 'Inter', Ubuntu, Arial, sans-serif; fill: #8A3FE0; }
    .s { font: 500 12px 'Segoe UI', 'Inter', Ubuntu, Arial, sans-serif; fill: #5A6185; }
    .l { font: 500 13px 'Segoe UI', 'Inter', Ubuntu, Arial, sans-serif; fill: #1F2328; }
    .p { font: 500 13px 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; fill: #5A6185; }
    .bar { transform-origin: 32px 0; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) .2s forwards; }
    .row { opacity: 0; animation: fade .6s ease forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <defs><clipPath id="c"><rect x="32" y="66" width="431" height="10" rx="5"/></clipPath></defs>
  <rect width="495" height="195" rx="6" fill="#F8F9FE"/>
  <text class="t" x="32" y="40">Most used languages</text>
  <text class="s" x="463" y="40" text-anchor="end">public repos</text>
  <rect x="32" y="66" width="431" height="10" rx="5" fill="#DDE1F2"/>
  <g class="bar" clip-path="url(#c)">
    <rect x="32" y="66" width="246.5" height="10" fill="#F1E05A"/>
    <rect x="278.5" y="66" width="101.7" height="10" fill="#3178C6"/>
    <rect x="380.2" y="66" width="33.6" height="10" fill="#3572A5"/>
    <rect x="413.8" y="66" width="16.4" height="10" fill="#B07219"/>
    <rect x="430.2" y="66" width="12.9" height="10" fill="#663399"/>
    <rect x="443.1" y="66" width="9.9" height="10" fill="#E34C26"/>
    <rect x="453" y="66" width="10" height="10" fill="#AA6746"/>
  </g>
  <g class="row" style="animation-delay:.5s">
    <circle cx="38" cy="113" r="5" fill="#F1E05A"/><text class="l" x="50" y="118">JavaScript</text><text class="p" x="160" y="118" text-anchor="end">57.2%</text>
    <circle cx="188" cy="113" r="5" fill="#3178C6"/><text class="l" x="200" y="118">TypeScript</text><text class="p" x="310" y="118" text-anchor="end">23.6%</text>
    <circle cx="338" cy="113" r="5" fill="#3572A5"/><text class="l" x="350" y="118">Python</text><text class="p" x="463" y="118" text-anchor="end">7.8%</text>
  </g>
  <g class="row" style="animation-delay:.65s">
    <circle cx="38" cy="143" r="5" fill="#B07219"/><text class="l" x="50" y="148">Java</text><text class="p" x="160" y="148" text-anchor="end">3.8%</text>
    <circle cx="188" cy="143" r="5" fill="#663399"/><text class="l" x="200" y="148">CSS</text><text class="p" x="310" y="148" text-anchor="end">3.0%</text>
    <circle cx="338" cy="143" r="5" fill="#E34C26"/><text class="l" x="350" y="148">HTML</text><text class="p" x="463" y="148" text-anchor="end">2.3%</text>
  </g>
  <g class="row" style="animation-delay:.8s">
    <circle cx="38" cy="173" r="5" fill="#AA6746"/><text class="l" x="50" y="178">Solidity</text><text class="p" x="160" y="178" text-anchor="end">2.2%</text>
  </g>
</svg>
